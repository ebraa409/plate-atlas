<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plate Atlas</title>
<meta name="description" content="Guess which country a dish comes from. Photos and dishes are loaded live from Wikipedia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one narrow column, like a menu card. Dish card on top, guess input, then guess rows stacked newest-first. */
:root{
  color-scheme: dark;
  --bg:#13111a;
  --surface:#1d1a26;
  --surface-2:#262233;
  --line:#332e42;
  --fg:#f3eee6;
  --muted:#a29bb2;
  --accent:#f2a541;       /* saffron */
  --accent-ink:#1a1206;
  --hot:#ff6a4d;
  --warm:#f3c34f;
  --cool:#86c1e8;
  --cold:#6f93f2;
  --freeze:#b7c6ff;
  --good:#5fd39a;
  --bad:#ff7a7a;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(1200px 500px at 50% -200px, rgba(242,165,65,.10), transparent 70%);
  color:var(--fg);
  font-family:var(--f-body);
  font-size:15px;
  line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:24px 48px;
}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,38px);letter-spacing:-.02em;margin:0;line-height:1}
.brand h1 span{color:var(--accent)}
.brand p{margin:6px 0 0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:14px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.stats div{display:flex;flex-direction:column;align-items:flex-end}
.stats b{color:var(--fg);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}

/* Dish card */
.dish{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
  display:flex;flex-direction:column;gap:14px;
  position:relative;overflow:hidden;
}
.dish::after{ /* plate rim */
  content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:50%;
  border:14px solid rgba(242,165,65,.08);box-shadow:inset 0 0 0 22px rgba(242,165,65,.04);pointer-events:none;
}
.photo{margin:-22px -22px 0;position:relative;background:var(--surface-2);aspect-ratio:16/10;max-width:none;overflow:hidden}
.photo img{display:block;width:100%;height:100%;object-fit:cover;max-width:none}
.photo .credit{position:absolute;right:8px;bottom:8px;font-size:11px;background:rgba(19,17,26,.75);color:var(--muted);padding:2px 8px;border-radius:6px;text-decoration:none}
.photo .credit:hover{color:var(--fg)}
.photo.none{display:none}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.dish-name{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,5.4vw,32px);line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance;min-height:1.1em}
.dish-name.locked{color:var(--muted);font-size:17px;font-family:var(--f-body);font-weight:500;display:flex;align-items:center;gap:8px}
.dish-name.locked .bars{display:inline-flex;gap:5px}
.dish-name.locked .bars i{display:block;height:14px;border-radius:4px;background:var(--surface-2)}
.dish-name.reveal{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.96);opacity:.3}100%{transform:none;opacity:1}}
.desc{margin:0;color:#ddd6cb;max-width:62ch}
.ing-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;color:var(--fg)}

/* Guess bar */
.status{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--muted);font-size:16px}
.pips{display:flex;gap:6px}
.pip{width:30px;height:8px;border-radius:5px;background:var(--surface-2)}
.pip.used{background:linear-gradient(90deg,var(--hot),var(--warm))}
.pip.win{background:var(--good)}
.status b{color:var(--fg);font-family:var(--f-mono);font-size:18px}

.guess-box{position:relative}
.guess-row{display:flex;gap:8px}
#guess{
  flex:1;min-width:0;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  color:var(--fg);font:inherit;font-size:16px;padding:13px 14px;outline:none;
}
#guess:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,165,65,.18)}
#guess::placeholder{color:var(--muted)}
button{font:inherit;cursor:pointer}
.btn{
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;
  padding:0 20px;font-weight:700;font-size:15px;
}
.btn:hover{filter:brightness(1.07)}
.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.list{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:5;
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;
  max-height:260px;overflow-y:auto;padding:4px;margin:0;list-style:none;
  box-shadow:0 18px 40px rgba(0,0,0,.45);
}
.opt{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer}
.opt[aria-selected="true"],.opt:hover{background:rgba(242,165,65,.14)}
.opt .fl{font-size:18px;width:24px;text-align:center}
.opt.used{opacity:.4;pointer-events:none}
.msg{min-height:20px;font-size:13px;color:var(--bad);text-align:center}

/* Guesses */
.guesses{display:flex;flex-direction:column;gap:8px}
.g{
  display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:8px 10px 8px 8px;animation:slide .35s ease;
}
@keyframes slide{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.g .flag{font-size:28px;width:44px;height:44px;display:grid;place-items:center;background:var(--surface-2);border-radius:10px}
.g .nm{min-width:0}
.g .nm strong{display:block;font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g .nm small{font-family:var(--f-mono);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pill{border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.pill.correct{background:rgba(95,211,154,.16);color:var(--good)}
.pill.hot{background:rgba(255,106,77,.16);color:var(--hot)}
.pill.warm{background:rgba(243,195,79,.15);color:var(--warm)}
.pill.cool{background:rgba(134,193,232,.14);color:var(--cool)}
.pill.cold{background:rgba(111,147,242,.16);color:var(--cold)}
.pill.freeze{background:rgba(183,198,255,.12);color:var(--freeze)}
.compass{position:relative;width:46px;height:46px;font-family:var(--f-mono);font-size:9px;color:var(--muted)}
.compass span{position:absolute}
.compass .n{top:0;left:50%;transform:translateX(-50%)}
.compass .s{bottom:0;left:50%;transform:translateX(-50%)}
.compass .w{left:1px;top:50%;transform:translateY(-50%)}
.compass .e{right:1px;top:50%;transform:translateY(-50%)}
.compass svg{position:absolute;inset:0;margin:auto;width:26px;height:26px;transition:transform .6s cubic-bezier(.2,.9,.3,1.2)}
.compass .check{position:absolute;inset:0;display:grid;place-items:center;color:var(--good);font-size:20px;font-weight:700}

/* Result */
.result{
  border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;
  border:1px solid var(--line);background:var(--surface-2);
}
.result.win{border-color:rgba(95,211,154,.45)}
.result.lose{border-color:rgba(255,122,122,.4)}
.result h2{margin:0;font-family:var(--f-display);font-size:22px;font-weight:700}
.result p{margin:0;color:var(--muted)}
.result p strong{color:var(--fg)}
.result .btn{align-self:flex-start;padding:12px 22px}

.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-size:12px;color:var(--muted)}
.legend .pill{font-size:11px;padding:3px 9px;font-weight:600}

@media (max-width:440px){
  .dish{padding:18px}
  .photo{margin:-18px -18px 0}
  .g{gap:9px}
  .g .flag{width:38px;height:38px;font-size:24px}
  .pill{padding:4px 9px;font-size:12px}
  .stats{gap:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.photo.loading::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.05) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.photo img{opacity:0;transition:opacity .35s ease}
.photo img.ready{opacity:1}
.photo .nophoto{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
.src{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.redact{background:var(--surface-2);color:var(--surface-2);border-radius:3px;padding:0 .2em;user-select:none}
.loadnote{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
.result a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Plate<span>.</span>Atlas</h1>
      <p>Read the dish. Name the country. Five guesses.</p>
    </div>
    <div class="stats" aria-label="Your stats">
      <div><b id="sStreak">0</b>streak</div>
      <div><b id="sBest">0</b>best</div>
      <div><b id="sWon">0/0</b>solved</div>
    </div>
  </header>

  <section class="dish" aria-live="polite">
    <div class="photo loading" id="photo"><img id="dishImg" alt="Photo of the mystery dish"><div class="nophoto" id="nophoto" hidden>No photo for this dish</div><a class="credit" id="credit" target="_blank" rel="noopener" hidden>Photo: Wikimedia Commons</a></div>
    <div class="eyebrow" id="dishNo">Loading…</div>
    <h2 class="dish-name locked" id="dishName"></h2>
    <p class="desc" id="dishDesc"></p>
    <div class="ing-label">Ingredients</div>
    <div class="chips" id="dishIng"></div>
  </section>

  <div class="status"><div class="pips" id="pips"></div><span><b id="left">5</b> guesses left</span></div>

  <div class="guess-box" id="guessBox">
    <form class="guess-row" id="form" autocomplete="off">
      <input id="guess" type="text" placeholder="Type a country…" aria-label="Country guess" role="combobox" aria-expanded="false" aria-controls="list" aria-autocomplete="list">
      <button class="btn" id="submit" type="submit">Guess</button>
    </form>
    <ul class="list" id="list" role="listbox" hidden></ul>
  </div>
  <div class="msg" id="msg"></div>

  <div class="result" id="result" hidden></div>
  <div class="guesses" id="guesses"></div>

  <div class="legend">
    <span>Closest</span>
    <span class="pill hot">Hot 🔥</span>
    <span class="pill warm">Warm</span>
    <span class="pill cool">Cool</span>
    <span class="pill cold">Cold ❄️</span>
    <span class="pill freeze">Freezing 🧊</span>
    <span>Farthest</span>
  </div>
  <div class="loadnote" id="loadnote"></div>
</div>

function distance(a,b){
  const R=6371, dLa=rad(b.la-a.la), dLo=rad(b.lo-a.lo);
  const h=Math.sin(dLa/2)**2+Math.cos(rad(a.la))*Math.cos(rad(b.la))*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function bearing(a,b){
  const y=Math.sin(rad(b.lo-a.lo))*Math.cos(rad(b.la));
  const x=Math.cos(rad(a.la))*Math.sin(rad(b.la))-Math.sin(rad(a.la))*Math.cos(rad(b.la))*Math.cos(rad(b.lo-a.lo));
  return (deg(Math.atan2(y,x))+360)%360;
}
function temp(km){
  if(km===0) return ["correct","Correct ✓"];
  if(km<1000) return ["hot","Hot 🔥"];
  if(km<2500) return ["warm","Warm"];
  if(km<5000) return ["cool","Cool"];
  if(km<9000) return ["cold","Cold ❄️"];
  return ["freeze","Freezing 🧊"];
}

const NAME_KEYS = [...NAME_TO_CODE.keys()].sort((a,b)=>b.length-a.length);

const REDACT_TERMS = new Set();
COUNTRIES.forEach(c=>REDACT_TERMS.add(c.n));
Object.values(ALIASES).forEach(l=>l.split(",").forEach(t=>REDACT_TERMS.add(t.trim())));

HINT_WORDS.split(",").forEach(t=>REDACT_TERMS.add(t.trim()));
REDACT_TERMS.add("Congo");
const REDACT_RE = new RegExp("(?<![\\p{L}\\p{M}])(?:"+[...REDACT_TERMS].filter(Boolean).sort((a,b)=>b.length-a.length).map(reEsc).join("|")+")(?:s|es)?(?![\\p{L}\\p{M}])","giu");
const MASK = "▇▇▇";

function redact(text, dishName, alsoTitle){
  let t = text;
  // strip parentheses (native-script names, pronunciations, language tags)
  for(let i=0;i<4;i++) t = t.replace(/\s*\([^()]*\)/g,"");
  const names = [dishName, alsoTitle].filter(Boolean);
  for(const n of names){
    t = t.replace(new RegExp(reEsc(n)+"(?:e?s)?(?![\\p{L}])","giu"),"This dish");
    n.split(/[\s\-–,]+/).filter(w=>w.length>=4).forEach(w=>{ t=t.replace(new RegExp("(?<![\\p{L}])"+reEsc(w)+"(?![\\p{L}])","giu"),"•••"); });
  }
  t = t.replace(REDACT_RE, MASK);
  t = t.replace(/\b(an?|the)\s+This dish/gi, (m,a)=>a[0]===a[0].toUpperCase()?"This dish":"this dish");
  t = t.replace(/([.!?]\s+|^)this dish/g, "$1This dish").replace(/(\S\s+)This dish/g, (m,p)=>/[.!?]\s+$/.test(p)?m:p+"this dish");
  return t.replace(/\s{2,}/g," ").trim();
}

// ---------- Wikipedia helpers ----------
async function api(params){
  const u = API+"?"+new URLSearchParams({format:"json",formatversion:"2",origin:"*",...params});
  const r = await fetch(u);
  if(!r.ok) throw new Error("Wikipedia "+r.status);
  return r.json();
}
function resolveTitle(q, title){
  let t=title;
  const seen=new Set();
  for(const list of [q.normalized||[], q.redirects||[]]) for(const x of list) if(x.from===t){ t=x.to; }
  // redirects can chain after normalisation
  for(const x of (q.redirects||[])) if(x.from===t && !seen.has(t)){ seen.add(t); t=x.to; }
  return t;
}
function biggerThumb(src, origW, want=960){
  if(!src) return src;
  if(/\/thumb\//.test(src) && origW && origW>want) return src.replace(/\/\d+px-/, "/"+want+"px-");
  return src;
}
function fileCredit(pageimage){ return pageimage ? "https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(pageimage) : null; }

// Fetch photos for many titles at once (50 per request).
async function photosFor(titles){
  const out = {};
  for(let i=0;i<titles.length;i+=50){
    const chunk = titles.slice(i,i+50);
    try{
      const j = await api({action:"query",prop:"pageimages",piprop:"thumbnail|name|original",pithumbsize:"800",redirects:"1",titles:chunk.join("|")});
      const q = j.query||{};
      const byTitle = Object.fromEntries((q.pages||[]).map(p=>[p.title,p]));
      for(const t of chunk){
        const p = byTitle[resolveTitle(q,t)];
        if(p && p.thumbnail) out[t] = {img:p.thumbnail.source, credit:fileCredit(p.pageimage), page:p.title, file:p.pageimage};
      }
    }catch(e){ console.warn(e); }
  }
  return out;
}

const seenPages = new Set();

async function loadCuratedPhotos(){
  const titles = POOL.map(d=>d.wiki);
  const res = await photosFor(titles);
  const fileUse = {};
  POOL.forEach(d=>{ const r=res[d.wiki]; if(r){ Object.assign(d,{img:r.img,credit:r.credit,page:r.page}); seenPages.add(r.page); fileUse[r.file]=(fileUse[r.file]||0)+1; } });
  // If two dishes share one photo (e.g. both redirect to one article), keep it on the first only.
  const used = new Set();
  POOL.forEach(d=>{ if(!d.img) return; const f=d.credit; if(used.has(f)){ d.img=null; } else used.add(f); });
}

// Parse Wikipedia's "National dish" article into country -> dish titles.
async function loadLiveList(){
  const r = await fetch(REST+"page/html/National_dish");
  if(!r.ok) throw new Error("Wikipedia "+r.status);
  const doc = new DOMParser().parseFromString(await r.text(), "text/html");
  const items = [...doc.querySelectorAll("li, tr, p")];
  const found = [];
  for(const el of items){
    if(el.closest(".reflist, .references, .navbox, .toc, .hatnote, .sidebar, .infobox")) continue;
    // own text only (skip nested lists, they are handled separately)
    const clone = el.cloneNode(true); clone.querySelectorAll("ul,ol,sup").forEach(n=>n.remove());
    const txt = norm(clone.textContent.replace(/\s+/g," "));
    if(!txt) continue;
    const key = NAME_KEYS.find(k=>txt.startsWith(k) && !/[a-z]/.test(txt.charAt(k.length)));
    if(!key) continue;
    const code = NAME_TO_CODE.get(key);
    const links = [...clone.querySelectorAll("a[href^='/wiki/'], a[href^='./']")]
      .map(a=>a.getAttribute("title")||"")
      .filter(t=>t && !t.includes(":") && !NAME_TO_CODE.has(norm(t)) && !/cuisine|culture of|list of|national|flag of|demographics|history of|wikipedia/i.test(t));
    links.slice(0,4).forEach(t=>found.push({code,wiki:t}));
  }
  return found;
}

async function htmlIngredients(title){
  const r = await fetch(REST+"page/html/"+encodeURIComponent(title.replace(/ /g,"_")));
  if(!r.ok) return [];
  const doc = new DOMParser().parseFromString(await r.text(),"text/html");
  const th = [...doc.querySelectorAll(".infobox th, table th")].find(t=>/main ingredient/i.test(t.textContent));
  const td = th && th.parentElement.querySelector("td");
  if(!td) return [];
  td.querySelectorAll("sup, style").forEach(n=>n.remove());
  td.querySelectorAll("br").forEach(n=>n.replaceWith(","));
  return td.textContent.split(/,|;|\band\b|\bor\b|\//).map(x=>x.trim().replace(/^[\-–•*]\s*/,"")).filter(x=>x && x.length<40).slice(0,9)
          .map(x=>x.charAt(0).toUpperCase()+x.slice(1));
}
const FOODY = /\b(dish|dishes|soup|stew|bread|pastry|pastries|cake|dessert|salad|sandwich|porridge|pie|dumpling|sausage|curry|snack|street food|noodle|rice|pancake|sweet|confection|delicacy|cheese|sauce|meal|cookie|biscuit|casserole|flatbread|pudding|tart|fritter|kebab|barbecue|grilled|fried|roast|stuffed|cured|fermented|appetizer|breakfast|spread|dip|omelette|skewer|bun|wrap|taco|pasta)\b/i;
const GENERIC = /^(meat|species|genus|family|plant|fruit|vegetable|cereal|grain|animal|domesticated|edible|type of (meat|plant|fruit|vegetable))\b/i;
function infoboxIngredients(wikitext){
  const m = wikitext.match(/\|\s*main[_ ]ingredients?\s*=\s*([^\n]*)/i);
  if(!m) return [];
  let s = m[1];
  s = s.replace(/<ref[^>]*\/>/g,"").replace(/<ref[\s\S]*?<\/ref>/g,"").replace(/<br\s*\/?>/gi,",")
       .replace(/\{\{[^{}]*\}\}/g,"").replace(/\[\[(?:[^|\]]*\|)?([^\]]+)\]\]/g,"$1").replace(/'''?/g,"").replace(/<[^>]+>/g,"");
  return s.split(/,|;|\band\b|\bor\b|\//).map(x=>x.trim().replace(/^[\-–•*]\s*/,"")).filter(x=>x && x.length<40).slice(0,9)
          .map(x=>x.charAt(0).toUpperCase()+x.slice(1));
}

// Fill in description, ingredients and photo for a live dish.
async function hydrate(d){
  if(d.ready) return d;
  if(d.failed) throw new Error("skip");
  try{
    const r = await fetch(REST+"page/summary/"+encodeURIComponent(d.wiki.replace(/ /g,"_")));
    if(!r.ok) throw new Error("summary "+r.status);
    const s = await r.json();
    if(s.type!=="standard" || !s.thumbnail || !s.extract) throw new Error("unusable");
    if(seenPages.has(s.title)) throw new Error("duplicate");
    if(d.live){
      const desc = (s.description||"")+" "+s.extract.slice(0,200);
      if(!FOODY.test(desc) || GENERIC.test(s.description||"")) throw new Error("not a dish");
    }
    seenPages.add(s.title);
    if(!d.live){
      d.page = s.title;
      d.img = biggerThumb(s.thumbnail.source, s.originalimage && s.originalimage.width);
      d.credit = s.content_urls && s.content_urls.desktop ? s.content_urls.desktop.page : null;
      d.ready = true;
      return d;
    }
    d.name = s.title.replace(/\s*\(.*?\)\s*$/,"");
    d.page = s.title;
    d.img = biggerThumb(s.thumbnail.source, s.originalimage && s.originalimage.width);
    d.credit = s.content_urls && s.content_urls.desktop ? s.content_urls.desktop.page : null;
    const sentences = s.extract.replace(/\s+/g," ").match(/[^.!?]+[.!?]+/g) || [s.extract];
    let desc = redact(sentences.slice(0,3).join(" "), d.name, d.wiki);
    if(desc.length>420) desc = desc.slice(0,400).replace(/\s\S*$/,"")+"…";
    d.desc = desc;
    try{ d.ing = (await htmlIngredients(s.title)).map(x=>redact(x,d.name,d.wiki)); }
    catch(e){ d.ing = []; }
    d.ready = true;
    return d;
  }catch(e){ d.failed = true; throw e; }
}

// ---------- game state ----------
let S = {bag:[], dish:null, round:0, guesses:[], status:"loading"};
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function playable(d){ return !d.failed; }
function refill(){ return shuffle(POOL.filter(playable)); }

async function nextDish(){
  S.status="loading"; render();
  for(let tries=0; tries<25; tries++){
    if(!S.bag.length) S.bag = refill();
    const d = S.bag.pop();
    if(!d) break;
    try{ await hydrate(d); }catch(e){ continue; }
    S.dish=d; S.guesses=[]; S.status="playing"; S.round++;
    render(); $("guess").value=""; $("guess").focus({preventScroll:true});
    prefetch();
    return;
  }
  $("dishNo").textContent="Couldn't load a dish";
  $("dishDesc").textContent="Wikipedia didn't respond. Check your connection and reload the page.";
}
function prefetch(){
  const n = S.bag[S.bag.length-1];
  if(!n) return;
  hydrate(n).then(d=>{ if(d.img){ const i=new Image(); i.src=d.img; } }).catch(()=>{ S.bag.pop(); prefetch(); });
}

function setPhoto(d){
  const ph=$("photo"), img=$("dishImg"), cr=$("credit"), no=$("nophoto");
  if(!d){ ph.className="photo loading"; img.classList.remove("ready"); img.removeAttribute("src"); no.hidden=true; cr.hidden=true; return; }
  if(d.img){
    no.hidden=true;
    if(img.getAttribute("src")!==d.img){
      img.classList.remove("ready"); ph.className="photo loading";
      img.onload=()=>{ img.classList.add("ready"); ph.className="photo"; };
      img.onerror=()=>{ ph.className="photo"; no.hidden=false; };
      img.src=d.img;
    }
  }else{ img.removeAttribute("src"); ph.className="photo"; no.hidden=false; }
  cr.href = d.credit || "#";
  cr.textContent = d.live ? "Photo & text: Wikipedia" : "Photo: Wikipedia";
  cr.hidden = S.status==="playing" || !d.credit;
}

function render(){
  const d = S.dish;
  if(S.status==="loading"){
    setPhoto(null);
    $("dishNo").textContent = S.round ? `Dish ${S.round+1}` : "Loading…";
    $("dishName").className="dish-name locked"; $("dishName").textContent="Plating up the next dish…";
    $("dishDesc").textContent=""; $("dishIng").innerHTML="";
    $("guessBox").hidden=true; $("result").hidden=true; $("guesses").innerHTML="";
    return;
  }
  const {name,code,desc,ing} = d;
  const wrong=S.guesses.filter(g=>g!==code).length;
  $("dishNo").textContent=`Dish ${S.round}`;
  setPhoto(d);
  const nameEl=$("dishName");
  const show = wrong>=REVEAL_AT || S.status!=="playing";
  if(show){
    const wasLocked = nameEl.classList.contains("locked");
    nameEl.className="dish-name"+(wasLocked?" reveal":"");
    nameEl.textContent=name;
  }else{
    nameEl.className="dish-name locked";
    const left=REVEAL_AT-wrong;
    nameEl.innerHTML=`<span class="bars"><i style="width:70px"></i><i style="width:46px"></i></span> Name revealed after ${left} more wrong ${left===1?"guess":"guesses"}`;
  }
  $("dishDesc").innerHTML = esc(desc).replaceAll(MASK,`<span class="redact" title="Hidden so it doesn't give the answer away">${MASK}</span>`);
  $("dishIng").innerHTML = ing && ing.length
    ? ing.map(i=>`<span class="chip">${esc(i).replaceAll(MASK,'<span class="redact">'+MASK+'</span>')}</span>`).join("")
    : `<span class="chip" style="color:var(--muted)">Not listed for this dish. Use the photo!</span>`;

  const won=S.status==="won";
  $("pips").innerHTML=Array.from({length:MAX},(_,i)=>{
    let c="pip"; if(i<S.guesses.length) c+= (won&&i===S.guesses.length-1)?" win":" used"; return `<span class="${c}"></span>`;
  }).join("");
  $("left").textContent=MAX-S.guesses.length;

  const ans=BY_CODE[code];
  $("guesses").innerHTML=S.guesses.slice().reverse().map(gc=>{
    const g=BY_CODE[gc];
    const km = gc===code?0:Math.round(distance(g,ans));
    const [cls,label]=temp(km);
    const b = Math.round(bearing(g,ans));
    const comp = km===0 ? `<div class="check">✓</div>` :
      `<svg viewBox="0 0 24 24" style="transform:rotate(${b}deg)" aria-hidden="true"><path d="M12 2 L17 20 L12 16 L7 20 Z" fill="var(--hot)"/></svg>`;
    return `<div class="g">
      <div class="flag" aria-hidden="true">${flag(gc)}</div>
      <div class="nm"><strong>${esc(g.n)}</strong></div>
      <span class="pill ${cls}">${label}</span>
      <div class="compass" aria-label="${km===0?"Correct":"Direction "+b+" degrees"}"><span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span>${comp}</div>
    </div>`;
  }).join("");

  const over=S.status!=="playing";
  $("guess").disabled=over; $("submit").disabled=over;
  $("guessBox").hidden=over;
  const r=$("result");
  if(over){
    r.hidden=false;
    r.className="result "+(won?"win":"lose");
    const more = d.page ? ` <a href="https://en.wikipedia.org/wiki/${encodeURIComponent(d.page.replace(/ /g,"_"))}" target="_blank" rel="noopener">Read about it</a>` : "";
    r.innerHTML = won
      ? `<h2>${flag(code)} Correct, it's ${esc(ans.n)}!</h2><p><strong>${esc(name)}</strong> solved in ${S.guesses.length} ${S.guesses.length===1?"guess":"guesses"}.${more}</p><button class="btn" id="next">Next dish →</button>`
      : `<h2>${flag(code)} It was ${esc(ans.n)}</h2><p>Out of guesses. <strong>${esc(name)}</strong> comes from ${esc(ans.n)}.${more}</p><button class="btn" id="next">Next dish →</button>`;
    $("next").onclick=()=>nextDish();
    $("next").focus({preventScroll:true});
  }else{ r.hidden=true; }
}

function submitGuess(code){
  if(S.status!=="playing") return;
  const msg=$("msg"); msg.textContent="";
  if(!code){ msg.textContent="Pick a country from the list."; return; }
  if(S.guesses.includes(code)){ msg.textContent=`You already guessed ${BY_CODE[code].n}.`; return; }
  S.guesses.push(code);
  const ans=S.dish.code;
  if(code===ans){ S.status="won"; stats.played++; stats.won++; stats.streak++; stats.best=Math.max(stats.best,stats.streak); saveStats(); }
  else if(S.guesses.length>=MAX){ S.status="lost"; stats.played++; stats.streak=0; saveStats(); }
  $("guess").value=""; closeList(); render();
}

// ---------- autocomplete ----------
const input=$("guess"), list=$("list");
let matches=[], active=0;
function openList(){
  const q=norm(input.value);
  if(!q){ closeList(); return; }
  matches=COUNTRIES.filter(c=>norm(c.n).includes(q))
    .sort((a,b)=>(norm(a.n).startsWith(q)?0:1)-(norm(b.n).startsWith(q)?0:1)||a.n.localeCompare(b.n)).slice(0,8);
  active=0;
  if(!matches.length){ list.innerHTML=`<li class="opt" style="pointer-events:none;color:var(--muted)">No country matches “${esc(input.value)}”</li>`; list.hidden=false; return; }
  list.innerHTML=matches.map((c,i)=>`<li class="opt${S.guesses.includes(c.c)?" used":""}" role="option" id="opt-${c.c}" data-c="${c.c}" aria-selected="${i===active}"><span class="fl">${flag(c.c)}</span>${esc(c.n)}</li>`).join("");
  list.hidden=false; input.setAttribute("aria-expanded","true");
}
function closeList(){ list.hidden=true; input.setAttribute("aria-expanded","false"); }
function highlight(){ [...list.children].forEach((li,i)=>li.setAttribute("aria-selected",i===active)); list.children[active]?.scrollIntoView({block:"nearest"}); }
input.addEventListener("input",()=>{ $("msg").textContent=""; openList(); });
input.addEventListener("keydown",e=>{
  if(list.hidden||!matches.length) return;
  if(e.key==="ArrowDown"){ e.preventDefault(); active=(active+1)%matches.length; highlight(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); active=(active-1+matches.length)%matches.length; highlight(); }
  else if(e.key==="Escape"){ closeList(); }
});
list.addEventListener("mousedown",e=>{ const li=e.target.closest(".opt[data-c]"); if(li){ e.preventDefault(); submitGuess(li.dataset.c); } });
input.addEventListener("blur",()=>setTimeout(closeList,120));
$("form").addEventListener("submit",e=>{
  e.preventDefault();
  const q=norm(input.value);
  const exact=COUNTRIES.find(c=>norm(c.n)===q);
  const pick = exact ? exact.c : (!list.hidden && matches[active]) ? matches[active].c : null;
  submitGuess(pick);
});

// ---------- boot ----------
(async function start(){
  renderStats();
  render();
  // Live dishes from Wikipedia's national dish list, loaded in the background.
  const livePromise = loadLiveList().then(items=>{
    const known = new Set(POOL.map(d=>norm(d.wiki)));
    let added = 0;
    for(const it of items){
      if(known.has(norm(it.wiki))) continue;
      known.add(norm(it.wiki));
      POOL.push({name:it.wiki, code:it.code, wiki:it.wiki, live:true, ready:false});
      added++;
    }
    // mix the new dishes into what's left of the current bag
    S.bag = shuffle(S.bag.concat(POOL.filter(d=>d.live && !d.ready && !d.failed)));
    $("loadnote").textContent = `${POOL.filter(playable).length} dishes in rotation, ${added} pulled live from Wikipedia.`;
    return added;
  }).catch(e=>{ console.warn("Live list failed", e); $("loadnote").textContent="Couldn't reach Wikipedia's dish list, so you're playing the built-in dishes."; });
  S.bag = refill();
  await nextDish();
  await livePromise;
})();
</script>
